<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>もじもじぼうけん</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#5db9e0; font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif; touch-action:manipulation; }
  #stage { position:absolute; left:50%; top:50%; width:1280px; height:720px; transform-origin:center center; border-radius:24px; overflow:hidden; background:linear-gradient(180deg,#8fd8f8 0%,#c8efff 45%,#fdf6e3 78%,#fdf6e3 100%); }

  /* ===== 背景SVG ===== */
  #bg { position:absolute; inset:0; z-index:0; pointer-events:none; }
  .sunrays { transform-origin:110px 96px; animation:sunspin 40s linear infinite; }
  @keyframes sunspin { to { transform:rotate(360deg); } }
  .cloud { animation:drift linear infinite; }
  .cloud.c1 { animation-duration:65s; } .cloud.c2 { animation-duration:95s; } .cloud.c3 { animation-duration:80s; }
  @keyframes drift { from { transform:translateX(-260px); } to { transform:translateX(1420px); } }
  .flower { transform-origin:bottom center; animation:sway 3.2s ease-in-out infinite alternate; }
  .flower.f2 { animation-duration:2.6s; } .flower.f3 { animation-duration:3.8s; }
  @keyframes sway { from { transform:rotate(-5deg); } to { transform:rotate(5deg); } }
  .balloon { position:absolute; z-index:1; animation:bob 4.5s ease-in-out infinite alternate; pointer-events:none; }
  .balloon.b2 { animation-duration:5.6s; }
  @keyframes bob { from { transform:translateY(0) rotate(-2deg); } to { transform:translateY(-26px) rotate(3deg); } }
  .bird { position:absolute; z-index:1; animation:flyacross 26s linear infinite; pointer-events:none; }
  .bird.bd2 { animation-duration:34s; animation-delay:9s; top:120px; }
  @keyframes flyacross { 0% { left:-80px; } 100% { left:1330px; } }

  /* ===== 共通 ===== */
  .screen { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; z-index:5; }
  .screen.active { display:flex; animation:screenIn .3s ease; }
  @keyframes screenIn { from { transform:translateY(10px); } to { transform:none; } }
  .togglebar { position:absolute; bottom:14px; right:16px; display:flex; gap:10px; z-index:60; }
  .togglebtn { width:56px; height:56px; border-radius:50%; border:3px solid #fff; background:#ffb703; font-size:27px; cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.18); display:flex; align-items:center; justify-content:center; }
  .togglebtn.off { background:#c9c9c9; filter:grayscale(1); opacity:.75; }
  .bigbtn { border:none; cursor:pointer; border-radius:999px; background:#ff595e; color:#fff; font-weight:900; box-shadow:0 6px 0 #c93a3e; transition:transform .08s; font-family:inherit; }
  .bigbtn:active { transform:translateY(4px); box-shadow:0 2px 0 #c93a3e; }
  .bigbtn.green { background:#8ac926; box-shadow:0 6px 0 #5f9420; }
  .bigbtn.blue { background:#1982c4; box-shadow:0 6px 0 #125e8f; }
  .backbtn { width:56px; height:56px; border-radius:50%; border:3px solid #fff; background:#8ac926; font-size:29px; cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.18); }
  .headrow { width:100%; display:flex; align-items:center; gap:16px; padding:14px 18px 4px 18px; }
  .headtitle { font-size:34px; font-weight:900; color:#26355d; background:rgba(255,255,255,.85); padding:4px 26px; border-radius:999px; }
  .tabs { display:flex; gap:10px; margin-left:auto; }
  .tabbtn { border:3px solid #fff; border-radius:999px; padding:8px 26px; font-size:24px; font-weight:900; cursor:pointer; font-family:inherit; color:#26355d; background:#ffe29a; box-shadow:0 3px 0 rgba(0,0,0,.15); }
  .tabbtn.on { background:#ff595e; color:#fff; }
  .mascot { transition:transform .2s; }
  .mascot.jump { animation:mjump .55s ease; }
  @keyframes mjump { 0%{transform:translateY(0);} 35%{transform:translateY(-30px) scale(1.06);} 70%{transform:translateY(0) scale(.97);} 100%{transform:none;} }
  .mascot.tilt { animation:mtilt .5s ease; }
  @keyframes mtilt { 0%,100%{transform:rotate(0);} 30%{transform:rotate(-8deg);} 65%{transform:rotate(7deg);} }
  .mascot.idle { animation:midle 2.8s ease-in-out infinite alternate; }
  @keyframes midle { from { transform:translateY(0); } to { transform:translateY(-7px); } }

  /* ===== 表紙 ===== */
  #cover { justify-content:center; }
  #coverTitle { display:flex; gap:2px; margin-top:2px; }
  #coverTitle span { font-size:88px; font-weight:900; display:inline-block; animation:titleBounce 1.6s ease-in-out infinite alternate; text-shadow:0 4px 0 #fff; }
  @keyframes titleBounce { from { transform:translateY(0) rotate(-2deg); } to { transform:translateY(-13px) rotate(2deg); } }
  #cover .subtitle { font-size:29px; color:#47608f; font-weight:800; margin-top:2px; }
  .coverBtns { display:flex; gap:20px; margin-top:16px; }
  .modebar { display:flex; gap:12px; margin-top:14px; }
  .modebtn { border:3px solid #fff; border-radius:999px; padding:8px 34px; font-size:26px; font-weight:900; cursor:pointer; font-family:inherit; color:#47608f; background:#e3e8f0; box-shadow:0 3px 0 rgba(0,0,0,.15); }
  .modebtn.on { background:#ff595e; color:#fff; }
  #startBtn { font-size:42px; padding:18px 62px; }
  #progressBtn { font-size:34px; padding:18px 44px; }
  #coverInfo { margin-top:18px; background:rgba(255,255,255,.8); border-radius:18px; padding:10px 26px; font-size:24px; font-weight:800; color:#47608f; display:flex; gap:26px; align-items:center; }
  #coverStamps { display:flex; gap:3px; }
  .cstamp { width:30px; height:27px; opacity:.16; filter:grayscale(1); }
  .cstamp.got { opacity:1; filter:none; }
  #teacherBtn { position:absolute; left:16px; bottom:12px; background:rgba(255,255,255,.65); border:none; border-radius:10px; font-size:16px; padding:6px 12px; cursor:pointer; color:#47608f; font-family:inherit; z-index:60; }

  /* ===== レベル選択 ===== */
  #levelGrid { display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; width:1180px; margin-top:16px; }
  .lvcard { border:none; border-radius:22px; padding:14px 16px 12px; cursor:pointer; font-family:inherit; text-align:left; position:relative; box-shadow:0 6px 0 rgba(38,53,93,.25); transition:transform .12s; animation:popIn .4s ease backwards; }
  .lvcard:hover { transform:scale(1.04) rotate(-.6deg); }
  .lvcard.locked { filter:grayscale(.85); opacity:.55; cursor:default; }
  .lvcard.locked:hover { transform:none; }
  @keyframes popIn { from { transform:scale(.85); } to { transform:scale(1); } }
  .lvnum { position:absolute; top:-12px; left:-10px; width:44px; height:44px; border-radius:50%; background:#26355d; color:#fff; font-size:24px; font-weight:900; display:flex; align-items:center; justify-content:center; border:3px solid #fff; }
  .lvname { font-size:27px; font-weight:900; color:#26355d; }
  .lvkana { display:flex; gap:3px; flex-wrap:wrap; margin-top:5px; }
  .lvkana i { font-style:normal; background:rgba(255,255,255,.85); border-radius:8px; padding:1px 6px; font-size:19px; font-weight:800; color:#26355d; }
  .lvkana i.done { background:#8ac926; color:#fff; }
  .lvfoot { margin-top:7px; font-size:19px; font-weight:800; color:#47608f; display:flex; justify-content:space-between; }

  /* ===== 進捗画面 ===== */
  #chartWrap { display:flex; gap:22px; margin-top:8px; width:1210px; justify-content:center; }
  .chartCol { background:rgba(255,255,255,.82); border-radius:20px; padding:12px 14px; }
  .chartCol h3 { font-size:21px; color:#47608f; margin-bottom:7px; }
  .krow { display:flex; align-items:center; gap:4px; margin-bottom:4px; }
  .krow .rlabel { width:30px; font-size:16px; font-weight:800; color:#8a97ad; text-align:center; }
  .kcell { width:41px; height:41px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:900; background:#e3e8f0; color:#a5b0c2; }
  .kcell.learn { background:#ffe29a; color:#26355d; }
  .kcell.master { background:#8ac926; color:#fff; box-shadow:inset 0 -3px 0 rgba(0,0,0,.15); }
  .kcell.ycell { width:52px; font-size:19px; }
  .legend { display:flex; gap:18px; font-size:19px; font-weight:800; color:#47608f; margin-top:8px; }
  .legend i { font-style:normal; display:inline-block; width:20px; height:20px; border-radius:6px; vertical-align:-3px; margin-right:5px; }
  #resetBtn { position:absolute; right:16px; bottom:12px; background:rgba(255,255,255,.65); border:none; border-radius:10px; font-size:16px; padding:6px 12px; cursor:pointer; color:#47608f; font-family:inherit; z-index:60; }

  /* ===== もじ紹介 ===== */
  #introGrid { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-content:center; width:1160px; flex:1; padding:8px 0; }
  .kcard { width:118px; height:118px; border:none; border-radius:20px; background:#fff; box-shadow:0 6px 0 #d5dbe8; font-size:56px; font-weight:900; color:#26355d; cursor:pointer; font-family:inherit; position:relative; animation:popIn .35s ease backwards; }
  .kcard.small { width:104px; height:104px; font-size:40px; }
  .kcard:active { transform:scale(.93); }
  .kcard.seen::after { content:"★"; position:absolute; top:2px; right:8px; font-size:22px; color:#ffb703; }
  .kcard.flip { animation:kflip .45s ease; }
  @keyframes kflip { 0%{transform:rotateY(0);} 50%{transform:rotateY(90deg) scale(1.12);} 100%{transform:rotateY(0);} }
  .nextbar { padding:10px 0 18px; }
  .nextbar button { font-size:30px; padding:12px 48px; }

  /* ===== ことばづくり ===== */
  #gameMain { display:flex; align-items:flex-start; gap:8px; margin-top:2px; width:100%; padding:0 26px; }
  #gameLeft { display:flex; flex-direction:column; align-items:center; width:210px; padding-top:26px; }
  #gameCenter { flex:1; display:flex; flex-direction:column; align-items:center; }
  #wordDots { display:flex; gap:7px; margin:6px 0 2px; }
  #wordDots i { width:20px; height:20px; border-radius:50%; background:#d5dbe8; }
  #wordDots i.done { background:#8ac926; }
  #wordDots i.now { background:#ff595e; animation:nextPulse 1s infinite; }
  #picCard { background:#fff; border-radius:28px; padding:12px; box-shadow:0 8px 0 rgba(38,53,93,.12); position:relative; cursor:pointer; animation:floaty 3.4s ease-in-out infinite alternate; }
  @keyframes floaty { from { transform:translateY(0) rotate(-.6deg); } to { transform:translateY(-8px) rotate(.6deg); } }
  #picImg { width:372px; height:244px; object-fit:contain; display:block; border-radius:16px; }
  #speakBtn { position:absolute; right:-22px; bottom:-16px; width:70px; height:70px; border-radius:50%; border:3px solid #fff; background:#1982c4; font-size:33px; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.2); }
  #slots { display:flex; gap:12px; margin-top:20px; min-height:110px; align-items:center; }
  .slot { width:98px; height:106px; background:#fff; border:4px dashed #b8c4d8; border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:62px; font-weight:900; color:#26355d; position:relative; }
  .slot.prefill { border-style:solid; border-color:#bfe3a8; background:#f2fbe9; color:#7a8699; cursor:default; }
  .slot.next { border-color:#ff595e; border-style:solid; animation:nextPulse 1s infinite; }
  @keyframes nextPulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,89,94,0);} 50%{box-shadow:0 0 0 8px rgba(255,89,94,.22);} }
  .slot.filled { border-style:solid; border-color:#ffd166; background:#fff7dd; cursor:pointer; }
  .slot.locked { border-color:#8ac926; background:#eefadb; cursor:default; }
  .slot.pop { animation:pop .3s ease; }
  @keyframes pop { 0%{transform:scale(1.35);} 100%{transform:scale(1);} }
  .slot.shake { animation:shake .45s ease; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-11px);} 40%{transform:translateX(11px);} 60%{transform:translateX(-8px);} 80%{transform:translateX(8px);} }
  #tiles { display:flex; gap:12px; margin-top:18px; flex-wrap:wrap; justify-content:center; max-width:900px; }
  .tile { width:98px; height:106px; background:linear-gradient(180deg,#fff,#f2f6ff); border:none; border-radius:18px; box-shadow:0 6px 0 #d5dbe8; font-size:62px; font-weight:900; color:#26355d; cursor:pointer; font-family:inherit; animation:popIn .3s ease backwards; }
  .tile:active { transform:scale(.93); }
  .tile.used { visibility:hidden; }
  .tile.hint { animation:hintGlow .9s infinite; background:#fff3b0; }
  @keyframes hintGlow { 0%,100%{ transform:translateY(0) rotate(0); box-shadow:0 6px 0 #d5dbe8, 0 0 0 0 rgba(255,183,3,0);} 50%{ transform:translateY(-10px) rotate(-3deg); box-shadow:0 6px 0 #d5dbe8, 0 0 0 12px rgba(255,183,3,.45);} }
  .fly { position:fixed; z-index:99; display:flex; align-items:center; justify-content:center; background:#fff; border-radius:18px; box-shadow:0 6px 0 #d5dbe8; font-weight:900; color:#26355d; pointer-events:none; }

  /* ===== チェック ===== */
  #checkMain { flex:1; display:flex; flex-direction:column; align-items:center; width:100%; }
  #qStars { display:flex; gap:8px; margin-top:4px; }
  #qStars i { font-style:normal; font-size:36px; filter:grayscale(1); opacity:.35; }
  #qStars i.on { filter:none; opacity:1; animation:pop .35s ease; }
  #qPrompt { font-size:30px; font-weight:900; color:#26355d; background:rgba(255,255,255,.85); border-radius:999px; padding:6px 30px; margin-top:8px; display:flex; align-items:center; gap:14px; }
  #qReplay { width:58px; height:58px; border-radius:50%; border:3px solid #fff; background:#1982c4; font-size:29px; cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.2); }
  #qPic { margin-top:10px; background:#fff; border-radius:24px; padding:10px; box-shadow:0 7px 0 rgba(38,53,93,.12); animation:floaty 3.4s ease-in-out infinite alternate; }
  #qPic img { width:300px; height:196px; object-fit:contain; display:block; border-radius:14px; }
  #qWord { display:flex; gap:10px; margin-top:14px; }
  #qWord .qw { width:84px; height:92px; background:#fff; border:4px solid #ffd166; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:54px; font-weight:900; color:#26355d; transition:transform .18s ease, background .18s ease, box-shadow .18s ease; }
  /* 読み上げ同期ハイライト：いま読まれている文字の枠が大きくなって光る */
  .slot { transition:transform .18s ease, background .18s ease, box-shadow .18s ease; }
  .slot.speaking, #qWord .qw.speaking { background:#ffe29a; border-color:#ffb703; border-style:solid; transform:scale(1.18); box-shadow:0 0 26px 10px rgba(255,183,3,.8); z-index:6; animation:none; }
  .kcard.speaking { background:#ffe29a; transform:scale(1.14) rotate(-2deg); box-shadow:0 0 26px 10px rgba(255,183,3,.75); }
  #qWord .qw.miss { border-style:dashed; border-color:#ff595e; color:#ff595e; background:#fff0f0; animation:nextPulse 1s infinite; }
  #qChoices { display:flex; gap:16px; margin-top:22px; }
  .choice { width:128px; height:128px; border:none; border-radius:22px; background:linear-gradient(180deg,#fff,#f2f6ff); box-shadow:0 7px 0 #d5dbe8; font-size:62px; font-weight:900; color:#26355d; cursor:pointer; font-family:inherit; animation:popIn .3s ease backwards; }
  .choice:active { transform:scale(.93); }
  .choice.right { background:#8ac926; color:#fff; box-shadow:0 7px 0 #5f9420; }
  .choice.wrong { background:#ffb3b8; animation:shake .45s ease; }
  .choice.dim { opacity:.45; }
  #checkMascotRow { display:flex; align-items:flex-end; gap:20px; margin-top:6px; }

  /* ===== 演出レイヤー・オーバーレイ ===== */
  #fxLayer { position:absolute; inset:0; z-index:80; pointer-events:none; overflow:hidden; }
  .spark { position:absolute; font-size:30px; animation:sparkFly .8s ease-out forwards; }
  @keyframes sparkFly { to { transform:translate(var(--dx), var(--dy)) scale(.3) rotate(160deg); opacity:0; } }
  .confetti { position:absolute; width:17px; height:25px; top:-34px; border-radius:4px; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(790px) rotate(680deg); } }
  .overlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; z-index:90; background:rgba(253,246,227,.78); }
  .overlay.active { display:flex; }
  .ovTitle { font-size:64px; font-weight:900; color:#26355d; text-shadow:0 4px 0 #fff; }
  .ovStars { font-size:74px; letter-spacing:8px; margin:6px 0; }
  .ovStars i { font-style:normal; filter:grayscale(1); opacity:.3; }
  .ovStars i.on { filter:none; opacity:1; display:inline-block; animation:pop .4s ease backwards; }
  .ovWord { font-size:88px; font-weight:900; color:#26355d; letter-spacing:.08em; text-shadow:0 4px 0 #fff; }
  .ovBtns { display:flex; gap:18px; margin-top:18px; }
  .ovBtns button { font-size:32px; padding:14px 44px; }
  .ovOnigiri { animation:bounce .7s infinite alternate ease-in-out; }
  @keyframes bounce { from{transform:translateY(0) scale(1);} to{transform:translateY(-24px) scale(1.05);} }
</style>
</head>
<body>
<div id="stage">
  <!-- 背景 -->
  <svg id="bg" viewBox="0 0 1280 720" preserveAspectRatio="none">
    <g class="sunrays" stroke="#ffd166" stroke-width="10" stroke-linecap="round">
      <line x1="110" y1="18" x2="110" y2="42"/><line x1="110" y1="150" x2="110" y2="174"/>
      <line x1="32" y1="96" x2="56" y2="96"/><line x1="164" y1="96" x2="188" y2="96"/>
      <line x1="55" y1="41" x2="72" y2="58"/><line x1="148" y1="134" x2="165" y2="151"/>
      <line x1="165" y1="41" x2="148" y2="58"/><line x1="72" y1="134" x2="55" y2="151"/>
    </g>
    <circle cx="110" cy="96" r="42" fill="#ffd166" stroke="#ffb703" stroke-width="6"/>
    <circle cx="96" cy="88" r="5" fill="#26355d"/><circle cx="124" cy="88" r="5" fill="#26355d"/>
    <path d="M94 106 Q110 118 126 106" stroke="#26355d" stroke-width="5" fill="none" stroke-linecap="round"/>
    <g fill="none" stroke-width="13" opacity="0.5" stroke-linecap="round">
      <path d="M 950 210 A 240 240 0 0 1 1190 210" stroke="#ff8fa3"/>
      <path d="M 972 210 A 218 218 0 0 1 1168 210" stroke="#ffb703"/>
      <path d="M 994 210 A 196 196 0 0 1 1146 210" stroke="#8ac926"/>
      <path d="M 1016 210 A 174 174 0 0 1 1124 210" stroke="#1982c4"/>
    </g>
    <g class="cloud c1" fill="#ffffff" opacity="0.95"><ellipse cx="60" cy="86" rx="58" ry="30"/><ellipse cx="105" cy="72" rx="46" ry="26"/><ellipse cx="20" cy="74" rx="34" ry="20"/></g>
    <g class="cloud c2" fill="#ffffff" opacity="0.85"><ellipse cx="60" cy="170" rx="48" ry="24"/><ellipse cx="98" cy="158" rx="38" ry="21"/></g>
    <g class="cloud c3" fill="#ffffff" opacity="0.9"><ellipse cx="60" cy="250" rx="40" ry="20"/><ellipse cx="92" cy="240" rx="30" ry="17"/></g>
    <path d="M0 720 L0 640 Q 240 585 520 632 T 1040 626 T 1280 640 L1280 720 Z" fill="#a7d97c"/>
    <path d="M0 720 L0 676 Q 320 628 700 668 T 1280 672 L1280 720 Z" fill="#8ac926"/>
    <g class="flower f1"><line x1="90" y1="720" x2="90" y2="664" stroke="#4d8f1f" stroke-width="6"/><circle cx="90" cy="652" r="17" fill="#ff8fa3"/><circle cx="90" cy="652" r="7" fill="#ffd166"/></g>
    <g class="flower f2"><line x1="190" y1="720" x2="190" y2="676" stroke="#4d8f1f" stroke-width="6"/><circle cx="190" cy="664" r="14" fill="#c39bd3"/><circle cx="190" cy="664" r="6" fill="#ffd166"/></g>
    <g class="flower f3"><line x1="1120" y1="720" x2="1120" y2="668" stroke="#4d8f1f" stroke-width="6"/><circle cx="1120" cy="656" r="16" fill="#ffb703"/><circle cx="1120" cy="656" r="7" fill="#ff8fa3"/></g>
    <g class="flower f2"><line x1="1210" y1="720" x2="1210" y2="680" stroke="#4d8f1f" stroke-width="6"/><circle cx="1210" cy="668" r="13" fill="#ff8fa3"/><circle cx="1210" cy="668" r="6" fill="#ffd166"/></g>
  </svg>
  <svg class="balloon" style="left:1060px; top:120px;" width="72" height="104" viewBox="0 0 72 104"><ellipse cx="36" cy="32" rx="30" ry="32" fill="#ff595e"/><path d="M36 64 L32 74 L40 74 Z" fill="#c93a3e"/><path d="M36 74 Q28 86 36 104" stroke="#47608f" stroke-width="3" fill="none"/></svg>
  <svg class="balloon b2" style="left:150px; top:230px;" width="56" height="82" viewBox="0 0 72 104"><ellipse cx="36" cy="32" rx="30" ry="32" fill="#1982c4"/><path d="M36 64 L32 74 L40 74 Z" fill="#125e8f"/><path d="M36 74 Q44 86 36 104" stroke="#47608f" stroke-width="3" fill="none"/></svg>
  <svg class="bird" style="top:70px;" width="52" height="30" viewBox="0 0 52 30"><path d="M2 18 Q14 4 26 16 Q38 4 50 18" stroke="#47608f" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
  <svg class="bird bd2" width="40" height="24" viewBox="0 0 52 30"><path d="M2 18 Q14 4 26 16 Q38 4 50 18" stroke="#47608f" stroke-width="4" fill="none" stroke-linecap="round"/></svg>

  <!-- 表紙 -->
  <div id="cover" class="screen active">
    <div class="togglebar">
      <button class="togglebtn" data-tgl="tts">🔊</button>
      <button class="togglebtn" data-tgl="se">🎶</button>

let speakSeq = 0;
function clearSpeaking() { document.querySelectorAll(".speaking").forEach(e => e.classList.remove("speaking")); }

/* 単語をモーラ（音の単位）に分解する。拗音は2文字で1単位。
   戻り値: [{text, pos:[文字インデックス...]}] */
function moraUnits(wordStr) {
  const chars = [...wordStr];
  const units = [];
  for (let i = 0; i < chars.length; i++) {
    if (i + 1 < chars.length && "ゃゅょャュョ".includes(chars[i + 1])) {
      units.push({ text: chars[i] + chars[i + 1], pos: [i, i + 1] }); i++;
    } else units.push({ text: chars[i], pos: [i] });
  }
  return units;
}
/* かな→母音の対応（伸ばし棒「ー」を読むときに使う） */
const VOWEL_OF = {};
[["あ", "あかさたなはまやらわがざだばぱぁゃ"], ["い", "いきしちにひみりぎじぢびぴぃ"], ["う", "うくすつぬふむゆるぐずづぶぷぅゅ"], ["え", "えけせてねへめれげぜでべぺぇ"], ["お", "おこそとのほもよろをごぞどぼぽぉょ"]].forEach(([v, ks]) => { [...ks].forEach(k => { VOWEL_OF[k] = v; }); });
Object.keys(VOWEL_OF).forEach(k => { VOWEL_OF[String.fromCharCode(k.charCodeAt(0) + 0x60)] = VOWEL_OF[k]; }); /* カタカナ側も同じ母音で引けるように */
/* 1音ずつ読むときの読みテキスト列。「ー」は直前の音の母音で読む（けーき→け・え・き） */
function moraSpeakTexts(units) {
  const out = [];
  let prevVowel = null;
  units.forEach(u => {
    if (u.text === "ー") out.push(prevVowel || "ー");
    else {
      out.push(u.text);
      prevVowel = VOWEL_OF[[...u.text].pop()] || prevVowel;
    }
  });
  return out;
}
/* 単語を1音ずつ読み上げ、読んでいる音の枠を光らせる（elsは文字インデックス順の要素配列） */
function speakWordSync(wordStr, els) {
  const units = moraUnits(wordStr);
  const texts = moraSpeakTexts(units);
  const my = ++speakSeq;
  clearSpeaking();
  const hi = u => { if (els) u.pos.forEach(p => { if (els[p]) els[p].classList.add("speaking"); }); };
  const lo = u => { if (els) u.pos.forEach(p => { if (els[p]) els[p].classList.remove("speaking"); }); };
  if (!settings.tts || !("speechSynthesis" in window)) {
    let i = 0;
    const step = () => {
      if (my !== speakSeq) return;
      if (i > 0) lo(units[i - 1]);
      if (i >= units.length) return;
      hi(units[i]); i++; setTimeout(step, 520);
    };
    step(); return;
  }
  speechSynthesis.cancel();
  let i = 0;
  const next = () => {
    if (my !== speakSeq) return;
    if (i > 0) lo(units[i - 1]);
    if (i >= units.length) return;
    const u = units[i];
    const speakText = texts[i]; i++;
    hi(u);
    const ut = new SpeechSynthesisUtterance(speakText);
    ut.lang = "ja-JP"; ut.rate = 0.8; ut.pitch = 1.15;
    let done = false;
    const fin = () => { if (done) return; done = true; setTimeout(next, 70); };
    ut.onend = fin; ut.onerror = fin;
    speechSynthesis.speak(ut);
    setTimeout(fin, 1500); /* onendが来ない環境向けの安全網 */
  };
  next();
}
/* 1文字の読み上げ中にそのカードを光らせる（もじ紹介用） */
function glowSpeak(el, text) {
  if (!settings.tts || !("speechSynthesis" in window)) {
    el.classList.add("speaking"); setTimeout(() => el.classList.remove("speaking"), 600); return;
  }
  speakSeq++; clearSpeaking();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP"; u.rate = 0.82; u.pitch = 1.15;
  el.classList.add("speaking");
  const off = () => el.classList.remove("speaking");
  u.onend = off; u.onerror = off; setTimeout(off, 1500);
  speechSynthesis.speak(u);
}

function blankPositions(wordStr, L) {
  const chars = [...wordStr];

  chars.forEach((c, i) => {

    else if (L.n === 12 && c === "う" && i > 0 && O_DAN.includes(chars[i - 1])) pos.push(i);
  });
  return pos.slice(0, 3);
}
function pickDistractors(answer, pools, n, exclude) {
  const ex = exclude || "";
  const out = [];
  for (const pool of pools) {
    for (const c of shuffle(pool.slice())) {
      if (out.length >= n) break;
      if (c !== answer && !out.includes(c) && ![...ex].includes(c)) out.push(c);
    }
    if (out.length >= n) break;
  }
  while (out.length < n) { const f = FILLER[Math.floor(Math.random() * FILLER.length)]; if (f !== answer && !out.includes(f) && ![...ex].includes(f)) out.push(f); }
  return out;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let gSession = null;   // {queue, idx}

function buildGameTiles(needed, wordStr) {
  /* 選択候補: おぼえた文字（過去レベル）＋今のレベルの文字を混ぜて復習も兼ねる */
  const pools = [masteredPool(wordStr, true).concat(curLevel.focus.filter(c => ![...wordStr].includes(c))), [...new Set(needed.flatMap(c => [...(SIMILAR[c] || "")]))].filter(c => ![...wordStr].includes(c))];
  const dummies = pickDistractors(needed[0], pools, needed.length <= 2 ? 3 : 2, wordStr).filter(c => !needed.includes(c));
  return shuffle(needed.concat(dummies).map(ch => ({ char: ch, used: false })));
}
function loadGameWord() {

    b.className = "tile" + (t.used ? " used" : ""); b.textContent = t.char; b.dataset.idx = i;
    b.style.animationDelay = Math.min(i * 0.04, 0.3) + "s";
    b.addEventListener("click", () => tapGameTile(i, b));
    box.appendChild(b);
  });
}
function clearHint() { document.querySelectorAll(".tile.hint").forEach(t => t.classList.remove("hint")); }
function pokeIdle() {
  clearHint();
  if (idleTimer) clearTimeout(idleTimer);
  if (!settings.hint || !document.getElementById("game").classList.contains("active")) return;
  idleTimer = setTimeout(showHint, gFail >= 2 ? 1200 : 5000);
}
function showHint() {
  const s = gSlots.find(s2 => s2.blank && s2.tileIndex === null && !s2.locked);
  if (!s) return;
  document.querySelectorAll(".tile").forEach(el => {
    const t = gTiles[+el.dataset.idx];
    if (t && !t.used && t.char === s.char) el.classList.add("hint");
  });
}
function fly(tileEl, slotEl, done) {
  const a = tileEl.getBoundingClientRect(), b = slotEl.getBoundingClientRect();
  const c = document.createElement("div");
  c.className = "fly"; c.textContent = tileEl.textContent;
  c.style.left = a.left + "px"; c.style.top = a.top + "px"; c.style.width = a.width + "px"; c.style.height = a.height + "px"; c.style.fontSize = "62px";
  document.body.appendChild(c);
  requestAnimationFrame(() => {
    c.style.transition = "left .34s ease, top .34s ease, width .34s ease, height .34s ease";
    c.style.left = b.left + "px"; c.style.top = b.top + "px"; c.style.width = b.width + "px"; c.style.height = b.height + "px";
  });
  setTimeout(() => { c.remove(); done(); }, 350);
}
function tapGameTile(i, el) {
  if (flying) return;
  const t = gTiles[i]; if (!t || t.used) return;
  const nextIdx = gSlots.findIndex(s => s.blank && s.tileIndex === null && !s.locked);
  if (nextIdx < 0) return;
  speak(readChar(t.char)); seTap();
  const slotEls = document.getElementById("slots").children;
  flying = true;
  fly(el, slotEls[nextIdx], () => {
    flying = false;
    t.used = true; gSlots[nextIdx].tileIndex = i;
    renderGameSlots(); renderGameTiles();
    const se = document.getElementById("slots").children[nextIdx];
    se.classList.add("pop");
    const r = se.getBoundingClientRect(); spawnStars(r.left + r.width / 2, r.top + r.height / 2, 5);
    seGood(); pokeIdle();
    if (gSlots.every(s => !s.blank || s.tileIndex !== null)) setTimeout(checkGameWord, 420);
  });
  el.classList.add("used");
}
function tapGameSlot(i) {
  if (flying) return;
  const s = gSlots[i];
  if (!s.blank || s.tileIndex === null || s.locked) return;
  gTiles[s.tileIndex].used = false; s.tileIndex = null;
  seTap(); renderGameSlots(); renderGameTiles(); pokeIdle();
}
function checkGameWord() {
  const wrong = [];
  gSlots.forEach((s, i) => { if (s.blank && s.tileIndex !== null && gTiles[s.tileIndex].char !== s.char) wrong.push(i); });
  if (wrong.length === 0) { onWordClear(); return; }
  gFail++; seBad(); setMascot("gameMascot", "think");
  const slotEls = document.getElementById("slots").children;
  wrong.forEach(i => slotEls[i].classList.add("shake"));
  setTimeout(() => {
    wrong.forEach(i => { gTiles[gSlots[i].tileIndex].used = false; gSlots[i].tileIndex = null; });
    gSlots.forEach(s => { if (s.blank && s.tileIndex !== null) s.locked = true; });
    renderGameSlots(); renderGameTiles(); pokeIdle();
  }, 500);
}
function onWordClear() {
  gSlots.forEach(s => { if (s.blank) s.locked = true; });
  renderGameSlots();
  seClear(); setMascot("gameMascot", "happy");
  document.getElementById("wordFxWord").textContent = gWord.wordStr;
  document.getElementById("wordFx").classList.add("active");
  const last = gSession.idx >= gSession.queue.length - 1;
  document.getElementById("wordNextBtn").textContent = last ? "おしまい ▶" : "つぎ ▶";
  speak(gWord.wordStr + "、できたね！");
  const r = document.getElementById("picImg").getBoundingClientRect();
  spawnStars(r.left + r.width / 2, r.top + r.height / 2, 10);
}
document.getElementById("wordNextBtn").addEventListener("click", () => {
  document.getElementById("wordFx").classList.remove("active");
  if (gSession.idx >= gSession.queue.length - 1) {
    showResult({
      title: "🎉 ことば ぜんぶ できた！", stars: 3,
      retryLabel: "もういちど ことば", onRetry: () => startWordSession(),
      nextLabel: "チェックに いく ▶", onNext: () => startCheck()
    });
  } else { gSession.idx++; loadGameWord(); }
});
document.getElementById("speakBtn").addEventListener("click", ev => { ev.stopPropagation(); if (gWord) speakWordSync(gWord.wordStr, [...document.getElementById("slots").children]); });
document.getElementById("picCard").addEventListener("click", () => { if (gWord) speakWordSync(gWord.wordStr, [...document.getElementById("slots").children]); });

/* ===== チェック ===== */
function makeChoices(answer, poolSource) {
  /* 選択肢にもおぼえた文字を混ぜる（答えと同じ長さのものだけ） */
  const mp = masteredPool(answer).filter(c => c.length === answer.length);
  const pools = [poolSource.filter(c => c !== answer), mp, [...(SIMILAR[answer] || "")]];
  const d = pickDistractors(answer, pools, 3);
  return shuffle([answer].concat(d));
}
function genCheck(L) {
  const qs = [];
  const totalQ = L.focus.length > 12 ? 8 : 5;
  const soundN = L.focus.length > 12 ? 5 : 3;
  const items = shuffle(L.checkItems.slice());
  items.slice(0, soundN).forEach(it => qs.push({ type: "sound", answer: it, choices: makeChoices(it, L.n === 11 ? YOUON_ALL : L.focus) }));
  const bCount = totalQ - qs.length;
  const words = shuffle(L.words.slice());
  for (let i = 0; i < bCount; i++) {
    const id = words[i % words.length];
    const wordStr = WORDS[id];
    const positions = blankPositions(wordStr, L);
    const pos = positions[Math.floor(Math.random() * positions.length)];
    const answer = [...wordStr][pos];
    qs.push({ type: "word", wordId: id, wordStr, pos, answer, choices: makeChoices(answer, L.blankChars.concat(L.focus)) });
  }
  return shuffle(qs);
}
let cSession = null;
function startCheck() {
  show("check");
  document.getElementById("checkTitle").textContent = "レベル" + curLevel.n + "：" + curLevel.name + " チェック";
  markIntro(curLevel.focus);
  cSession = { qs: genCheck(curLevel), qi: 0, score: 0, results: [], lock: false };
  renderCheckQ();
}
function renderCheckQ() {
  const q = cSession.qs[cSession.qi];
  cSession.lock = false;
  const stars = document.getElementById("qStars"); stars.innerHTML = "";
  for (let i = 0; i < cSession.qs.length; i++) {
    const s = document.createElement("i"); s.textContent = "⭐";
    if (cSession.results[i]) s.className = "on";
    stars.appendChild(s);
  }
  const isWord = q.type === "word";
  document.getElementById("qPromptText").textContent = isWord ? "あいた ところに はいる もじは どれ？" : "きこえた もじは どれ？";
  document.getElementById("qPic").style.display = isWord ? "" : "none";
  document.getElementById("qWord").style.display = isWord ? "" : "none";
  if (isWord) {
    document.getElementById("qPicImg").src = IMG[q.wordId] || "";
    const w = document.getElementById("qWord"); w.innerHTML = "";
    [...q.wordStr].forEach((c, i) => {
      const d = document.createElement("div");
      d.className = "qw" + (i === q.pos ? " miss" : "");
      d.textContent = i === q.pos ? "？" : c;
      w.appendChild(d);
    });
  }
  const box = document.getElementById("qChoices"); box.innerHTML = "";
  q.choices.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "choice"; b.textContent = c; b.style.animationDelay = Math.min(i * 0.05, 0.25) + "s";
    if (c.length >= 2) b.style.fontSize = "44px";
    b.addEventListener("click", () => answerCheck(c, b));
    box.appendChild(b);
  });
  setMascot("checkMascot", "normal");
  setTimeout(() => {
    if (isWord) speakWordSync(q.wordStr, [...document.getElementById("qWord").children]);
    else speak(readChar(q.answer));
  }, 350);
}
function answerCheck(choice, btn) {
  if (cSession.lock) return;
  cSession.lock = true;
  const q = cSession.qs[cSession.qi];
  const ok = choice === q.answer;
  cSession.results[cSession.qi] = ok;
  if (ok) cSession.score++;
  document.querySelectorAll(".choice").forEach(b => {
    if (b.textContent === q.answer) b.classList.add("right");
    else if (b === btn) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  if (ok) {
    seStar(); setMascot("checkMascot", "happy");
    const r = btn.getBoundingClientRect(); spawnStars(r.left + r.width / 2, r.top + r.height / 2, 8);
    speak(q.type === "word" ? "せいかい！ " + q.wordStr : "せいかい！");
  } else {
    seBad(); setMascot("checkMascot", "think");
    speak("こたえは " + readChar(q.answer));
  }
  const stars = document.getElementById("qStars").children;
  if (stars[cSession.qi]) stars[cSession.qi].className = ok ? "on" : "";
  setTimeout(() => {
    cSession.qi++;
    if (cSession.qi >= cSession.qs.length) finishCheck();
    else renderCheckQ();
  }, 1250);
}
document.getElementById("qReplay").addEventListener("click", () => {
  const q = cSession.qs[cSession.qi];
  if (q.type === "word") speakWordSync(q.wordStr, [...document.getElementById("qWord").children]);
  else speak(readChar(q.answer));
});
function finishCheck() {
  const passed = cSession.score >= Math.ceil(cSession.qs.length * 0.75);
  if (passed) {
    curLevel.focus.forEach(k => { progress.mastered[k] = 1; progress.intro[k] = 1; });
    if (!progress.cleared.includes(curLevel.n)) progress.cleared.push(curLevel.n);
    saveProgress();
    seClear(); confettiBurst();
  } else { seBad(); }
  const nextL = LEVELS.find(L => L.n === curLevel.n + 1);
  showResult({
    title: passed ? "⭐ レベルクリア！" : "あと すこし！ (" + cSession.score + "/" + cSession.qs.length + ")",
    stars: cSession.score, total: cSession.qs.length,
    retryLabel: "もういちど チェック", onRetry: () => startCheck(),
    nextLabel: passed && nextL ? "つぎのレベル ▶" : null,
    onNext: passed && nextL ? () => openLevel(nextL, "intro") : null
  });
}

/* ===== 結果オーバーレイ ===== */
let resultCfg = null;
function showResult(cfg) {
  resultCfg = cfg;
  document.getElementById("resultTitle").textContent = cfg.title;
  const st = document.getElementById("resultStars"); st.innerHTML = "";
  const total = cfg.total || 3;
  for (let i = 0; i < total; i++) {
    const s = document.createElement("i"); s.textContent = "⭐";
    if (i < cfg.stars) { s.className = "on"; s.style.animationDelay = (i * 0.15) + "s"; }
    st.appendChild(s);
  }
  document.getElementById("resultRetry").textContent = cfg.retryLabel || "もういちど";
  const nb = document.getElementById("resultNext");
  if (cfg.nextLabel) { nb.style.display = ""; nb.textContent = cfg.nextLabel; } else nb.style.display = "none";
  document.getElementById("resultFx").classList.add("active");
}
document.getElementById("resultRetry").addEventListener("click", () => { document.getElementById("resultFx").classList.remove("active"); if (resultCfg && resultCfg.onRetry) resultCfg.onRetry(); });
document.getElementById("resultLevels").addEventListener("click", () => { document.getElementById("resultFx").classList.remove("active"); show("levels"); });
document.getElementById("resultNext").addEventListener("click", () => { document.getElementById("resultFx").classList.remove("active"); if (resultCfg && resultCfg.onNext) resultCfg.onNext(); });

/* ===== 初期化 ===== */
renderMascots();
renderCover();
</script>
